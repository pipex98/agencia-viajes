services:
  agenciaviajes.api:
    image: ${DOCKER_REGISTRY-}agenciaviajes.api
    build:
      context: .
      dockerfile: AgenciaViajes.API/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://agenciaviajes.dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER};Database=${DB_DATABASE};User Id=${DB_USER};${DB_PASSWORD};TrustServerCertificate=true; 
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - default
    
  db:
    container_name: agenciaviajes.database
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    volumes:
      - mssql-data:/var/opt/mssql
    ports: 
      - 1433:1433
    healthcheck:
      test: [ 
        "CMD", "/opt/mssql-tools18/bin/sqlcmd", 
        "-S", "localhost", 
        "-U", "sa", 
        "-P", "YourStrong!Passw0rd", 
        "-C", 
        "-Q", "SELECT 1" 
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default
   
  agenciaviajes.dashboard:
    container_name: aspire-dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - 18888:18888
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  mssql-data: